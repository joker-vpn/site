    <clipPath id="right"><rect x="0" y="-80" width="80" height="160"/></clipPath>
    <polygon id="star" points="0,-10 2.35,-3.24 9.51,-3.09 3.8,1.24 5.88,8.09 0,4 -5.88,8.09 -3.8,1.24 -9.51,-3.09 -2.35,-3.24"/>
  </defs>
